[project]
name = "lstm-forecaster"
version = "0.1.0"
description = "Multistep demand & financial forecasting with a stacked PyTorch LSTM, measured honestly against naive/ARIMA baselines under leak-free, time-ordered validation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hector Garza", email = "hectorg@smartxchain.com" }]

# Runtime dependencies. The evaluation harness and baselines are the core;
# torch is the deep-model participant, not the headline. See SPEC.md §6.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "torch>=2.2",
    "gradio>=4.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# No importable package exists yet (M0 is the scaffold). This lets
# `pip install -e .` succeed for dependencies without package auto-discovery
# tripping on the empty tree. Switch to `[tool.setuptools.packages.find]`
# over `src/` once M1 lands real modules.
[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pycodestyle (E), pyflakes (F), isort (I), pyupgrade (UP), bugbear (B).
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# Make `src/` importable as `src.*` once it exists, without an editable reinstall.
pythonpath = ["."]
testpaths = ["tests"]

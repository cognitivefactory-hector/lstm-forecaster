name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheels keep CI fast and within runner limits.
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest
        # The no-leakage test (arriving in M1) is mandatory in CI. See PLAN.md.
        run: pytest
